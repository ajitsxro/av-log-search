services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: av
      POSTGRES_PASSWORD: av
      POSTGRES_DB: avsearch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://av:av@db:5432/avsearch
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./data/nuscenes/samples:/app/data/nuscenes/samples:ro
    depends_on:
      - db

volumes:
  pgdata: